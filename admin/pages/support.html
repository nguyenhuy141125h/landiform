<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f6f8" />
    <title>Yêu cầu hỗ trợ | LANDIFORM</title>
    <link rel="icon" type="image/svg+xml" href="../../website/assets/favicon.svg" />
    <link rel="stylesheet" href="../../website/public/css/be-vietnam-pro.css" />
    <link rel="stylesheet" href="../../website/public/css/fontawesome.min.css" />
    <link rel="stylesheet" href="../public/css/dashboard.css?v=20261027-menu-group-icons-v1" />
    <link rel="stylesheet" href="../public/css/admin-screens.css?v=20261027-topbar-line-fix-v1" />
    <link rel="stylesheet" href="../public/css/admin-selects.css?v=20261026-native-popup-v3" />
    <link rel="stylesheet" href="../public/css/support.css?v=20261027-topbar-account-borderless-v1" />
</head>
<body class="dashboard-body">
    <script src="../public/js/clear-landiform-storage.js?v=20261027-clear-old-storage-v1"></script>
<div class="app-shell">
    <aside class="sidebar" id="sidebar" data-admin-shared-shell aria-label="Điều hướng quản trị"></aside>
    <main class="main-panel">
        <header class="topbar" data-admin-shared-topbar data-page-label="Yêu cầu hỗ trợ"></header>
        <div class="dashboard-content screen-content support-page">
            <header class="screen-heading"><div><p class="screen-eyebrow">LANDIFORM CARE</p><h1>Trung tâm hỗ trợ</h1><p>Gửi yêu cầu đến đội ngũ LANDIFORM. Chọn đúngng nội dung để đội hỗ trợ tiếp nhận nhanh hơn.</p></div></header>
            <div class="support-layout">
                <section class="panel screen-panel support-form-panel"><div class="screen-panel-head"><div><span class="panel-kicker">TẠO PHIẾU HỖ TRỢ</span><h2>Thông tin yêu cầu</h2><p>Các mục có đầu * là bắt buộc.</p></div></div>
                    <form id="supportForm" class="support-form">
                        <div class="support-form-row"><label>Họ và tên *<input name="name" required autocomplete="name" placeholder="Tên người liên hệ" /></label><label>Email nhận phản hồi<input name="email" type="email" autocomplete="email" placeholder="ten@congty.vn" /></label></div>
                        <div class="support-form-row"><label>Doanh nghiệp *<input name="company" required autocomplete="organization" placeholder="Tên doanh nghiệp" /></label><label>Chi nhánh<input name="branch" placeholder="Ví dụ: Hồ Chí Minh" /></label></div>
                        <div class="support-form-row"><label>Số điện thoại (bắt buộc nếu chọn gọi)<input name="phone" type="tel" autocomplete="tel" placeholder="09xx xxx xxx" /></label><label>Nhận phản hồi qua<select name="replyVia"><option>Email</option><option>Điện thoại</option><option>Email hoặc điện thoại</option></select></label></div>
                        <div class="support-form-row"><label>Nhóm cần hỗ trợ *<select name="category" required><option value="">Chọn nhóm vấn đề</option><option>Lỗi kỹ thuật</option><option>Tài khoản và phân quyền</option><option>Hướng dẫn sử dụng</option><option>Website, biểu mẫu và mã QR</option><option>Khách hàng và giao dịch</option><option>Báo cáo và dữ liệu</option><option>Khác</option></select></label><label>Mức độ ảnh hưởng<select name="priority"><option>Bình thường</option><option>Ảnh hưởng một phần</option><option>Khẩn cấp</option></select></label></div>
                        <label>Tiêu đề yêu cầu *<input name="subject" required maxlength="120" placeholder="Ví dụ: Không lưu được biểu mẫu đăng ký" /></label>
                        <label>Mô tả chi tiết *<textarea name="description" rows="5" required minlength="15" placeholder="Bạn đang ở trang nào? Đã thao tác những bước gì? Hệ thống hiển thị kết quả ra sao?"></textarea></label>
                        <div class="support-form-actions"><button class="button button-primary" type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Gửi yêu cầu hỗ trợ</button></div>
                    </form>
                    <div class="support-success" id="supportSuccess" hidden role="status"><span><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span><h3>Đã hoàn tất biểu mẫu</h3><p>Đây là trạng thái minh họa cho giao điền hỗ trợ.</p><button class="button button-secondary" id="supportAgain" type="button">Tạo yêu cầu khác</button></div>
                </section>
            </div>
            <footer class="dashboard-footer" data-admin-shared-footer></footer>
        </div>
    </main>
</div>
<div class="toast-message" id="toastMessage" role="status" aria-live="polite"></div><script src="../public/js/admin-common.js?v=20261027-topbar-line-fix-v1"></script>
<script src="../public/js/support.js?v=20261027-support-form-v2"></script>
</body>
</html>
